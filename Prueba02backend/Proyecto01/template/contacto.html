<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - TechStore</title>
    <style>
        :root{--accent:#0f62fe;--bg:#0f1720;--card:#0b1220;--muted:#9aa4b2}
        *{box-sizing:border-box}
        body{font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:linear-gradient(180deg,#07203a 0%, #071827 100%);color:#e6eef6}
        header{background:rgba(0,0,0,0.25);backdrop-filter:blur(6px);padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
        .brand{font-weight:700;font-size:1.1rem;display:flex;gap:10px;align-items:center}
        nav a{color:var(--accent);text-decoration:none;margin-left:14px;padding:8px 12px;border-radius:6px;background:transparent}
        nav a:hover{background:rgba(255,255,255,0.04)}
        .container{max-width:1100px;margin:28px auto;padding:0 20px}
        .box{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:12px;border-radius:10px;margin-bottom:12px}
        .btn{background:var(--accent);color:white;padding:8px 12px;border-radius:8px;border:none}
    </style>
</head>
<body>
    <header>
        <div class="brand">TechStore <span style="font-weight:400;color:var(--muted);font-size:0.9rem;margin-left:6px">Electrónica & Tecnología</span></div>
        <nav>
            <a href="/">Inicio</a>
            <a href="/productos/">Productos</a>
            <a href="/noticias/">Noticias</a>
            <a href="/cuenta/">Cuenta</a>
            <a href="/contacto/">Contacto</a>
            {% if usuario %}
                <span style="margin-left:12px;color:var(--muted)">Hola, {{ usuario.usuario }}</span>
                <form method="post" action="/cuenta/" style="display:inline;margin-left:8px">
                    {% csrf_token %}
                    <input type="hidden" name="action" value="logout">
                    <button class="btn" type="submit" style="padding:6px 8px">Cerrar sesión</button>
                </form>
            {% endif %}
        </nav>
    </header>

    <div class="container">
        <h1>Contacto</h1>
        <div class="box">
            <p>Escribe a <strong>contacto@techstore.example</strong> para más información.</p>
        </div>
    </div>
</body>
</html>
